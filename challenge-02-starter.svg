<text x="125" y="615" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#234b43">Two shapes. One untouched gap. What could the space become?</text>
<polyline points="44.000,695.000 756.000,695.000" fill="none" stroke="#d3d9cb" stroke-width="1"/>
<text x="44" y="725" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#234b43">Look between the shapes.</text>
<text x="44" y="755" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#56736c">Keep the gap blank. Build the meaning around it.</text>
<text x="44" y="782" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#56736c">One start. Many possibilities.  |  Illustrative example, not a correct answer.</text>
