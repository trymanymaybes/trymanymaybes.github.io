name: Refresh submission catalogue
on:
  push:
    branches: [main]
    paths: ['challenge-*.html', 'scripts/build_submission_catalogue.py']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: submission-catalogue
  cancel-in-progress: false
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_submission_catalogue.py
      - name: Update generated metadata
        run: |
          if git diff --quiet -- submission-challenges.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission-challenges.json
          git commit -m 'Refresh published challenge catalogue'
          git push origin HEAD:main
      - name: Request Pages rebuild for generated catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
