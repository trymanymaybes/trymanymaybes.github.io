<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc"><title>A small robot approaches a charging dock</title><desc>A robot camera view frames a rectangular charging panel. The two starter lines become charging contacts below it. Floor perspective lines lead towards the dock; battery and scan indicators frame the view.</desc><rect width="800" height="800" fill="#faf7ef"/><g fill="none" stroke="#a77945" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M290 270h210v80H290zM330 310h130M390 290v40M420 470v10h80v-10M420 515v10h80v-10M200 680l150 -130M600 680l-80 -130M80 180v-50h50M670 130h50v50M80 620v50h50M670 670h50v-50"/><rect x="100" y="80" width="80" height="30"/><rect x="180" y="89" width="9" height="12"/><text x="205" y="104" fill="#234b43" stroke="none" font-family="sans-serif" font-size="18">LOW BATTERY</text><text x="280" y="730" fill="#234b43" stroke="none" font-family="sans-serif" font-size="22">ALIGN TO DOCK</text></g><g fill="none" stroke="#234b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="250,230 550,230 550,390 250,390 250,230"/><polyline points="420,470 500,470"/><polyline points="420,515 500,515"/></g></svg>
